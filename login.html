<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Boiz Racing | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="header">
            <img src="big boyz logo.png.png" alt="big boyz logo.png." class="logo">
            <h2>MEMBER LOGIN</h2>
        </div>
        <form>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            
            <div class="forgot-link">
                <a href="#">Forgot Password?</a>
            </div>
            
            <button type="button" class="action-btn standout">LOGIN</button>
            
            <div class="footer-link">
                <p>Don't have an account? <a href="index.html">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
